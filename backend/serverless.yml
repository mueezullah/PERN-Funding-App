# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: fundme
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: fundme
# "service" is the name of this project. This will also be added to your AWS resource names.
service: fundme

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    MEDIA_BUCKET_STAGING: fundme-media-staging
    # Didit KYC — set real values in Serverless Dashboard / CI secrets per stage
    DIDIT_API_KEY: ${env:DIDIT_API_KEY, env:DIDIT_API_CLIENT_ID}
    DIDIT_WEBHOOK_SECRET: ${env:DIDIT_WEBHOOK_SECRET}
    DIDIT_WORKFLOW_ID: ${env:DIDIT_WORKFLOW_ID}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::fundme-media-${sls:stage}/*
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

package:
  patterns:
    - "!.env"
    - "!.env*"

functions:
  api:
    handler: src/handler.handler
    events:
      - httpApi: "*"
